<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vendor Vantage Dashboard</title>
    <style>
      body {
        font-family: sans-serif;
        padding: 20px;
        background-color: #f9fafb;
        color: #111827;
      }
      h1 {
        color: #2563eb;
      }
      .stats {
        font-size: 1.2rem;
        font-weight: bold;
        margin-bottom: 20px;
      }
      .table-container {
        overflow-x: auto;
        background: white;
        border-radius: 8px;
        box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 800px;
      }
      th,
      td {
        padding: 12px 16px;
        border-bottom: 1px solid #e5e7eb;
        text-align: left;
      }
      th {
        background: #f3f4f6;
        font-weight: 600;
        text-transform: uppercase;
        font-size: 0.875rem;
        color: #4b5563;
      }
      tr:hover {
        background-color: #f9fafb;
      }
      .empty-state {
        text-align: center;
        padding: 40px;
        color: #6b7280;
      }
    </style>
  </head>
  <body>
    <h1>Vendor Vantage Dashboard</h1>
    <div class="stats">Total Products: {{ total }}</div>

    <div class="table-container">
      {% if products %}
      <table>
        <thead>
          <tr>
            {% for key in products[0].keys() %}
            <th>{{ key }}</th>
            {% endfor %}
          </tr>
        </thead>
        <tbody>
          {% for product in products %}
          <tr>
            {% for key, value in product.items() %}
            <td>{{ value }}</td>
            {% endfor %}
          </tr>
          {% endfor %}
        </tbody>
      </table>
      {% else %}
      <div class="empty-state">No products found.</div>
      {% endif %}
    </div>
  </body>
</html>
